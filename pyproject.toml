[project]
name = "croustillant-classifier"
version = "2.1.0"
description = "Nettoyage, dédoublonnage et typage des plats des restaurants du CROUS."
authors = [{ name = "CROUStillant Développement" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
# Aucune dépendance à l'exécution : uniquement des règles et des tables JSON figées.
dependencies = []

[project.urls]
homepage = "https://croustillant.menu"
repository = "https://github.com/CROUStillant-Developpement/CROUStillantClassifier"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# seul le paquet est livré : tools/, data/, out/ restent dans le dépôt
packages = ["croustillant_classifier"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.16",
    "psycopg2-binary>=2.9.11",
]
